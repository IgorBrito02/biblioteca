spring:
  application:
    name: biblioteca
  profiles:
    active: dev   # 🔹 Troque para "prod" quando quiser rodar no MySQL

---

# ===============================
# = Ambiente DEV (H2)
# ===============================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:biblioteca-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

---

# ===============================
# = Ambiente PROD (MySQL)
# ===============================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://localhost:3306/biblioteca?useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: senharoot

  jpa:
    hibernate:
      ddl-auto: update # Mantido 'update' para o ambiente de produção
    show-sql: false

server:
  port: 8081